[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inductor-demo"
version = "0.1.0"
description = "A small, source-oriented FX to Triton compiler for learning Inductor"
requires-python = ">=3.9"

[project.optional-dependencies]
fx = ["torch>=2.7"]
cuda = ["torch==2.7.0", "triton==3.3.0; sys_platform == 'linux'"]
test = ["expecttest", "numpy"]

[tool.setuptools.packages.find]
include = ["inductor_demo*"]
